name: sync
# 每周拉上游词库 → 裁剪打包 → 开 PR 人工审
on:
  schedule:
    - cron: '0 3 * * 1' # 周一 UTC 03:00 = 北京 11:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync upstream dictionaries
        run: node scripts/sync.mjs

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/data-refresh
          delete-branch: true
          title: 'chore: weekly data refresh'
          commit-message: 'update data pack'
          body-path: data/sync-report.md
          add-paths: |
            data/dict-pack.bin
            data/pack-meta.json
            data/sync-report.md
